<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Calendário de aniversários da família Firinfifim" />
    <meta name="app-version" content="1.3.1" />
    <title>Aniversários — Família Firinfifim</title>
    <script>
      (function () {
        var VERSION = "1.3.1";
        var KEY = "firinfifim-app-version";
        try {
          var prev = localStorage.getItem(KEY);
          if (prev && prev !== VERSION) {
            localStorage.setItem(KEY, VERSION);
            var url = new URL(window.location.href);
            url.searchParams.set("_v", VERSION);
            window.location.replace(url.toString());
            return;
          }
          localStorage.setItem(KEY, VERSION);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=1.3.1" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <p class="header-kicker">Família Firinfifim</p>
        <h1 class="header-title">Aniversários</h1>
        <div class="selectors" role="group" aria-label="Ano e mês do calendário">
          <label class="field">
            <span class="field-label">Ano</span>
            <select id="year" class="select" aria-label="Selecionar ano"></select>
          </label>
          <label class="field">
            <span class="field-label">Mês</span>
            <select id="month" class="select" aria-label="Selecionar mês"></select>
          </label>
        </div>
        <div id="view-filter" class="view-filter" role="group" aria-label="Tipo de aniversário">
          <button type="button" class="view-filter__btn" data-view="todos" aria-pressed="false">Todos</button>
          <button type="button" class="view-filter__btn" data-view="pessoa" aria-pressed="false">Pessoas</button>
          <button type="button" class="view-filter__btn" data-view="casamento" aria-pressed="false">Casamentos</button>
        </div>
      </header>

      <main class="main">
        <div id="calendar-carousel" class="calendar-carousel">
          <p id="calendar-carousel-hint" class="calendar-carousel__hint">
            <span class="calendar-carousel__hint-arrows" aria-hidden="true">← →</span>
            Deslize para mudar o mês
          </p>
          <div
            id="calendar-carousel-viewport"
            class="calendar-carousel__viewport"
            aria-label="Calendário — deslize horizontalmente para mudar o mês"
          >
            <div id="calendar-carousel-loading" class="calendar-carousel__loading" hidden aria-live="polite">
              <span class="calendar-carousel__spinner" aria-hidden="true"></span>
              <span class="calendar-carousel__loading-label">Virando o mês…</span>
            </div>
            <span class="calendar-carousel__arrow calendar-carousel__arrow--prev" aria-hidden="true">‹</span>
            <span class="calendar-carousel__arrow calendar-carousel__arrow--next" aria-hidden="true">›</span>
            <div id="calendar-carousel-track" class="calendar-carousel__track">
              <div class="calendar-shell">
                <div
                  id="cal-weekdays"
                  class="cal-weekdays cal-weekdays--sticky"
                  role="row"
                  aria-label="Colunas dos dias da semana"
                ></div>
                <div
                  id="calendar-grid"
                  class="cal-grid calendar"
                  role="grid"
                  aria-label="Calendário mensal com aniversariantes"
                ></div>
              </div>
            </div>
          </div>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p id="error" class="error" role="alert" hidden></p>
      </main>
    </div>

    <div id="day-modal" class="day-modal" hidden>
      <div class="day-modal__inner">
        <button type="button" class="day-modal__backdrop" aria-label="Fechar"></button>
        <div
          class="day-modal__panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="day-modal-heading"
          tabindex="-1"
        >
          <button type="button" class="day-modal__close" aria-label="Fechar">&times;</button>
          <h2 id="day-modal-heading" class="day-modal__heading">Aniversariantes</h2>
          <p id="day-modal-date" class="day-modal__date"></p>
          <div id="day-modal-grid" class="day-modal__grid"></div>
        </div>
      </div>
    </div>

    <script src="main.js?v=1.3.1"></script>
  </body>
</html>
